<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos do fornecedor</title>
</head>
<body>
    <header>
        <h1>Produtos de <span id="nome_fornecedor">Fornecedor de Alimentos S.A.</span></h1>
    </header>

    <main>
        <section>
        <h2>Cadastrar / Editar produtos</h2>
        <form action="#" method="POST">
            <input type="hidden" id="id_produto" name="idproduto">
            <input type="hidden" id="id_fornecedor" name="idfornecedor"> 

            <div>
                <label for="nome-produto">Nome do produto:</label>
                <input type="text" id="nome-produto" name="nome" required>
            </div>
            <br>

            <div>
                <label for="estoque">Quantidade em estoque:</label>
                <input type="number" id="estoque" min="0" value="0" required>
            </div>
            <br>

            <button type="submit">Salvar produto</button>

        </form>
        </section>
        <br>

            <section>
                <h2>Lista de produtos</h2>
                <table border="1">
                    <thead>
                            <tr>
                                <td>Nome do produto</td>
                                <td>Quantidade em estoque</td>
                                <td>Atributos</td>
                            </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Produto 1</td>
                            <td>10</td>
                            <td>
                                <button>Editar</button>
                                <button>Excluir</button>
                            </td>
                        </tr>

                        <tr>
                            <td>Produto 2 </td>
                            <td>30</td>
                            <td>
                                <button>Editar</button>
                                <button>Excluir</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>

    </main>

<a href="tela_inicial.html"> Voltar para a tela inicial</a>




</body>
</html>
